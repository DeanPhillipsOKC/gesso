# Acrylic, beginner: paint along, back to front, the way most YouTube beginner tutorials teach.
# No toned ground, no sketch, no separate block-in: start on a plain white canvas and paint each
# part of the scene from farthest to nearest, then texture, shadows, and highlights. Each step names
# the brush move to use (owner's pick, 2026-10-19).
# Owner's corrections from the pumpkin-patch lesson (2026-11-11): run the sky past the ground so its
# swirls stay continuous, and build shaped objects from simple pieces, as the real tutorials do.
#
# This technique sets the rules; Claude plans the steps for each picture within them (no fixed
# stage list, docs/decisions.md). The fixed seven-stage version is in git history (5936bbe).

id: acrylic-paint-along-beginner
medium: acrylic
level: beginner
name: Paint along, back to front
summary: >-
  Start on a plain white canvas. Paint the sky first, then each part of the scene from farthest to
  nearest, each straight over the one behind it. Then the main subject, texture with simple brush
  moves, shadows, and highlights last.

palette:
  - Titanium white
  - Cadmium yellow medium (hue)
  - Cadmium red medium (hue)
  - Ultramarine blue
  - Burnt sienna

# The pipeline starts from a plain white canvas instead of a toned one.
ground: white

# How many steps a lesson may have. Claude picks the number that fits the picture.
step_range: [5, 12]

rules:
  - Paint back to front. What's farthest away goes on first; anything in front goes on later, on top.
  - Paint background areas straight through where thinner things in front will go (branches, poles, grass, shrubs). Never leave gaps or outlines for them.
  - Run each background layer past where the next layer will cover it, so its strokes stay long and continuous. A sky goes below the horizon, and all the way to the bottom edge when its strokes are circular or swirly; the ground is then painted over it. Never stop a sky at the hill line and leave white canvas below.
  - Build each shaped object from simple pieces, the way a teacher draws it. Start with one simple shape (an oval, circle, or rectangle), then add the rest in curved pieces. A pumpkin is a center oval first, then curved side segments on each side like ( ) or moustache shapes, smaller toward the edges. Say this in the block-in step's instructions, and show it as a construction diagram (simple pieces, one panel per move).
  - Each step paints one part of the picture or a small group of parts at the same distance. No empty steps, and no step for something the picture doesn't have.
  - Big shapes before small ones. Texture, shadows, and highlights come after the shapes they sit on, and only where the picture has them.
  - Give the main subject the steps a teacher would. Base color, shading, and highlights are separate steps when the subject has them, and a teacher's two or three shading layers (a darker middle tone, then the darkest lines, then the light) stay separate steps too.
  - Anything in front of the subject (leaves, grass, flowers, vines at its base) goes on after the subject, over it.
  - The last step is the final details and brightest highlights, and it ends with the finished painting.
  - Every color is a named mix of the palette tubes. Reuse the same mix name whenever the same paint is used again.
  - Beginner-friendly: 2 to 5 short instructions per step, plain words, one brush move per instruction.

brush_moves:
  - Long side-to-side strokes or the X stroke for blending skies and gradients while wet
  - Tapping or dabbing with the brush corner, an old stiff brush, or a sponge for foliage and distant tree lines
  - Pulling and tapering with a small round brush for trunks, branches, and stems (press, then lift)
  - Flicking upward with a fan brush edge for grass
  - Dry brushing with very little paint for soft light, mist, and texture
  - Horizontal strokes for ground, water, and fields; strokes that follow the direction of roads and paths
  - A liner brush for twigs and fine lines
  - Building a shape from simple pieces: one center shape first, then curved strokes hugging it on each side, like parentheses

dry_time: About 10 minutes between steps (a hair dryer on low speeds it up). An hour after the last step before handling.

# Same framing for every image, so the steps line up when you flip between them.
framing: >-
  Straight-on view of the whole canvas filling the frame edge to edge, evenly lit. No easel,
  hands, brushes, table, or background.

simplify:
  prompt: >-
    Simplify this image into a reference a beginner acrylic painter could copy. Keep the
    composition and the main subject exactly where they are. Merge small details into a handful of
    large, simple shapes (roughly 10 to 25). Reduce it to three clear values: light, middle, and
    dark. Keep only colors that can be mixed from white, yellow, red, ultramarine blue, and burnt
    sienna, but keep every area's own color and hue: mix purples, golds, and mint greens rather
    than swapping them for plainer colors. Remove clutter and anything a beginner couldn't paint in
    an afternoon, but keep the character of each texture in simple form (scattered dabs stay
    scattered dabs, splattered stars stay many small dots, swirls stay swirls). Don't add objects
    or turn anything into something else. It must still be clearly the same scene. Flat image, full frame, no border, no text.

finish:
  prompt: >-
    Paint this reference as a finished acrylic painting by a careful beginner on stretched canvas.
    Simple shapes, slightly soft edges, visible brushstrokes, matte acrylic finish, canvas weave
    faintly visible in thin areas. Limited palette of white, yellow, red, ultramarine blue, and
    burnt sienna. Charming and achievable, not photorealistic. Keep the composition exactly as in
    the reference, and keep every area's colors and textures as in the reference.
