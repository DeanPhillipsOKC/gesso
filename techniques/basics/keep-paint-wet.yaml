id: keep-paint-wet
name: Keep paint from drying on the palette
lines:
- Acrylic on a brushstroke stays wet for only a few minutes.
- 'Mist the palette lightly with a spray bottle now and then. Only lightly: too much water weakens the paint.'
- Cover the paint when you aren't using it.
sources:
- docs/research/acrylic-paint-along.md, section 3, Drying time and open time
- docs/research/acrylic-paint-along.md, section 3, Keeping paint workable on the palette
checked: false
