id: wet-blend
stroke_result: Wet-on-wet blend (two wet colors, light load)
name: Wet-on-wet blend
brushes:
- flat
- wash brush
load: 'Don''t overload: less paint often blends better. If the paint starts to drag, add a tiny bit of water to
  the brush.'
motion: Work fast, in one area, while both colors are still wet.
result: A soft transition, only where both paints were still wet.
then: Stop when the paint drags; streaks can stay.
mistakes:
- mistake: The paint turns gooey and pulls up.
  why: It has started to set. Acrylic stays wet for only a few minutes.
  fix: Stop. Let it dry, then blend a new layer on top.
- mistake: Muddy, lifeless color.
  why: Overblending.
  fix: Blend a few strokes and stop. Visible streaks often look natural.
diagram:
  title: Blend only while both are wet
  stages:
  - caption: Two wet colors, touching
    add:
