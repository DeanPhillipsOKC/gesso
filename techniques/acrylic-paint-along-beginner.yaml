# Acrylic, beginner: paint along, back to front, the way most YouTube beginner tutorials teach.
# No toned ground, no sketch, no separate block-in: start on a plain white canvas and paint each
# part of the scene from farthest to nearest, then texture, shadows, and highlights. Each step names
# the brush move to use (owner's pick, 2026-10-19).
# Owner's corrections from the pumpkin-patch lesson (2026-11-11): run the sky past the ground so its
# swirls stay continuous, and build shaped objects from simple pieces, as the real tutorials do.
#
# This technique sets the rules; Claude plans the steps for each picture within them (no fixed
# stage list, docs/decisions.md). The fixed seven-stage version is in git history (5936bbe).

id: acrylic-paint-along-beginner
medium: acrylic
level: beginner
name: Paint along, back to front
summary: >-
  Start on a plain white canvas. Paint the sky first, then each part of the scene from farthest to
  nearest, each straight over the one behind it. Then the main subject, texture with simple brush
  moves, shadows, and highlights last.

palette:
  - Titanium white
  - Cadmium yellow medium (hue)
  - Cadmium red medium (hue)
  - Ultramarine blue
  - Burnt sienna

# The pipeline starts from a plain white canvas instead of a toned one.
ground: white

# How many steps a lesson may have. Claude picks the number that fits the picture.
step_range: [5, 12]

# How much detail a lesson at this level can hold. Pictures with more get a beginner version first (skill step 0c).
detail_budget:
  max_parts: 8
  notes: >-
    Big shapes, painted back to front. Every texture is one repeated mark a beginner can make with one brush,
    loose and impressionist. No tiny separate things (houses, windows, people, boats, fence posts) unless one is
    the subject, and no detail inside big shapes beyond what one repeated mark gives.

beginner_version:
  prompt: >-
    Repaint this picture as a simple, loose, impressionist painting a beginner could paint in an afternoon. Keep
    the composition, the subject, the light, the mood, and every area's colors and share of the canvas. Make
    every texture from big, loose, repeated brush dabs instead of fine detail, and use fewer, broader shapes. Make
    these changes:

rules:
  - Paint back to front. What's farthest away goes on first; anything in front goes on later, on top.
  - Paint background areas straight through where thinner things in front will go (branches, poles, grass, shrubs). Never leave gaps or outlines for them.
  - Run each background layer past where the next layer will cover it, so its strokes stay long and continuous. A sky goes below the horizon, and all the way to the bottom edge when its strokes are circular or swirly; the ground is then painted over it. Never stop a sky at the hill line and leave white canvas below.
  - Build each shaped object from simple pieces, the way a teacher draws it. Start with one simple shape (an oval, circle, or rectangle), then add the rest in curved pieces. A pumpkin is a center oval first, then curved side segments on each side like ( ) or moustache shapes, smaller toward the edges. Say this in the block-in step's instructions, and show it as a construction diagram (simple pieces, one panel per move).
  - Each step paints one part of the picture or a small group of parts at the same distance. No empty steps, and no step for something the picture doesn't have.
  - No step jumps from flat to dense texture. A texture step adds one kind of mark at a size a beginner can make in a few minutes; dense texture is split into passes (dark marks, then light marks), each its own step.
  - Big shapes before small ones. Texture, shadows, and highlights come after the shapes they sit on, and only where the picture has them.
  - Give the main subject the steps a teacher would. Base color, shading, and highlights are separate steps when the subject has them, and a teacher's two or three shading layers (a darker middle tone, then the darkest lines, then the light) stay separate steps too.
  - Anything in front of the subject (leaves, grass, flowers, vines at its base) goes on after the subject, over it.
  - The last step is the final details and brightest highlights, and it ends with the finished painting.
  - Every color is a named mix of the palette tubes. Reuse the same mix name whenever the same paint is used again.
  - Beginner-friendly: 2 to 5 short instructions per step, plain words, one brush move per instruction.
  - Let a layer dry before painting on top of it. Whenever a step paints over color from an earlier step (stripes, details, ribs, highlights over a base), its first instruction says to let that layer dry first: a few minutes, or a hair dryer on low, until it's dry to the touch. Wet paint underneath mixes into mud and makes lines feather. Always before liner lines, dots, outlines, a contrasting color, or dry-brush highlights.
  - Wet-on-wet blending happens only within one step, in one area, in about 5 minutes. Say to work fast and stop blending as soon as the paint starts to drag. Never tell the painter to scrub an area that has started to set; say to let it dry and paint over it.
  - Give each area the values the picture shows. Every 3D object (clouds, hills, trees, pumpkins, a balloon) gets at least three values made from one base mix: a darker base, a mid value on the lit side, and a small lightest accent on the lit edge, each covering less than the last. Name them dark, mid, and light, and say where each goes. One flat mix only where the picture is flat.
  - State the light direction in the first step, and keep every highlight on that side.
  - Farther things get lighter, a little bluer or grayer, less contrast, softer edges, and no texture. Texture (grass, foliage taps, bark) goes only in the middle ground and foreground.
  - Stroke direction follows the form: down the ribs of a pumpkin, around a balloon, small circles for clouds, upward for grass, outward from the trunk for branches. Say the direction in the instruction.
  - Every instruction names the brush, the mix, the paint load (wet and creamy, thin and flowing like ink, or nearly dry), the stroke, its direction, and where on the canvas. Each step ends by saying what it should look like when done, including what should still show through.
  - Light over dark needs 2 to 3 thin coats with drying between; say so where it happens. Keep layers thin to medium, no thick impasto.
  - Suggest a test stroke on scrap paper before any new kind of stroke (fan brush tapping, liner lines, dry brush, press and lift).
  - Once per lesson, say colors dry a little darker, so test a mix on the palette edge before a big area. Once around the middle, say the painting goes through an ugly stage and that's normal.

brush_moves:
  - Long side-to-side strokes or the X stroke for blending skies and gradients while wet
  - Tapping or dabbing with the brush corner, an old stiff brush, or a sponge for foliage and distant tree lines
  - Pulling and tapering with a small round brush for trunks, branches, and stems (press, then lift)
  - Flicking upward with a fan brush edge for grass
  - Dry brushing with very little paint for soft light, mist, and texture
  - Horizontal strokes for ground, water, and fields; strokes that follow the direction of roads and paths
  - A liner brush for twigs and fine lines
  - Building a shape from simple pieces: one center shape first, then curved strokes hugging it on each side, like parentheses

# What each stroke really leaves on the canvas, and what to do after it to change that. The step review (#24)
# checks a step's picture against these, not against its own idea of a stroke, so add to this list when a
# lesson uses a stroke it doesn't cover.
stroke_results:
  # From docs/research/acrylic-paint-along.md ("For Gesso", stroke results), with cited sources there.
  - stroke: Long horizontal blend (flat brush, even coat)
    leaves: Smooth bands of color, with a soft join where two wet colors meet.
    then: Stroke back over each join while wet. If a join is harsh, add more of the lighter color there.
  - stroke: X stroke, criss-cross, or slip-slap (flat brush)
    leaves: A soft, slightly textured blended fill with visible criss-cross marks.
    then: For a smooth, even gradient, go over it while wet with lighter, longer side-to-side strokes. Or leave it as texture.
  - stroke: Double load (flat or angle brush, two colors on two corners)
    leaves: A two-tone stroke that blends partway between the colors.
    then: Reload both colors for each stroke. Don't try to make it fully smooth.
  - stroke: Dabbing or stippling (round tip or stiff brush, little paint)
    leaves: Dots or dappled patches that get more solid the more you tap.
    then: Tap a lighter mix on the lit side, leaving the darker taps showing underneath.
  - stroke: Fan brush tapping (thin paint, spread bristles, middle tips)
    leaves: Needle or branch clusters, light at the top and heavier where pressed.
    then: If the top is too heavy, add fine branches with a small round instead of more fan marks.
  - stroke: Dry brush (no water, tip loaded and wiped nearly clean, light pressure)
    leaves: Feathery, broken, see-through marks that catch the canvas texture. Never a solid area.
    then: Build up in several light passes. If too solid, let it dry and dry-brush the base color back over part of it.
  - stroke: Scumbling (loose, scrubby dry-brush strokes, light over dark)
    leaves: A hazy, broken layer with the dark showing through.
    then: If it covers too much, let it dry and scumble the dark back in.
  - stroke: Glazing (transparent color thinned with medium, over dry paint)
    leaves: A see-through tint over what's underneath.
    then: If it's too dark, paint a lighter opaque color over it. Rarely used at beginner level.
  - stroke: Wet-on-wet blend (two wet colors, light load)
    leaves: A soft transition, only where both paints were still wet.
    then: Stop when the paint drags; streaks can stay. If it has set, let it dry and blend a new layer on top.
  - stroke: Press and lift (round brush, press the belly, lift to the tip)
    leaves: A teardrop or comma shape, for petals and leaves.
    then: If it's blobby, use less paint and lift faster. Tidy edges with the background color once dry.
  - stroke: Thick-to-thin (flat or angle brush, press, then turn to the edge)
    leaves: A tapered line, for branches and grass.
    then: Add a few thinner offshoots with a liner.
  - stroke: Flicking (light load, quick upward stroke from the base)
    leaves: Tapered blades with broken tips, denser at the base.
    then: Flick a lighter green over the dark base, fewer as you go up.
  - stroke: Liner work (paint thinned to ink, brush upright, light steady pressure)
    leaves: Thin, flowing lines; skippy, broken lines if the paint is too thick.
    then: Reload often. Only paint lines over dry paint, or they spread.
  - stroke: Dotting (brush handle end or a dotting tool, fresh paint for each dot)
    leaves: Round, slightly raised dots.
    then: Wipe a bad dot off while it's wet, or cover it with the background color once dry.
  - stroke: Splatter (thinned paint, toothbrush or a flicked brush)
    leaves: Random speckles, for stars or snow.
    then: Wipe strays right away with a damp swab. Let it dry before the next step.
  - stroke: Small circles with the brush tip (clouds)
    leaves: A bumpy, soft edge.
    then: Smooth with the same circular motion, and highlight only the lit top edges.
  - stroke: Curved strokes that follow a form (hills, pumpkin ribs, a balloon)
    leaves: Marks that bend with the shape, which is what makes it look round or sloped.
    then: Use the darker mix along the shadow side and the lighter one along the lit side, both following the curve.
  - stroke: Strokes toward a vanishing point (rows, paths, fences, furrows)
    leaves: Bands that narrow and bunch together toward one point, which is what makes the ground lie down and recede.
    then: Mark the point first with a dot. Pull every stroke along its row toward that dot, front to back, with the rows wide in front and thin near the point. Check a few rows with the brush handle held from the dot.
  - stroke: Horizontal strokes for flat ground (fields, water, distant land)
    leaves: Flat, level bands that read as ground stretching away; slight streaks that follow the stroke.
    then: Keep the brush level and the strokes long. Lighter and smoother toward the back, darker and more textured in front.
  - stroke: Building from pieces (a center shape, then curved pieces on each side like parentheses)
    leaves: A shape made of distinct curved segments with small gaps or overlaps between them.
    then: Soften where the pieces meet only if the picture shows smooth ribs; otherwise leave the segments visible.

dry_time: About 10 minutes between steps (a hair dryer on low speeds it up). An hour after the last step before handling.

# Same framing for every image, so the steps line up when you flip between them.
framing: >-
  Straight-on view of the whole canvas filling the frame edge to edge, evenly lit. No easel,
  hands, brushes, table, or background.

simplify:
  prompt: >-
    Simplify this image into a reference a beginner acrylic painter could copy. Keep the
    composition and the main subject exactly where they are. Merge small details into a handful of
    large, simple shapes (roughly 10 to 25). Reduce it to three clear values: light, middle, and
    dark. Keep only colors that can be mixed from white, yellow, red, ultramarine blue, and burnt
    sienna, but keep every area's own color and hue: mix purples, golds, and mint greens rather
    than swapping them for plainer colors. Remove clutter and anything a beginner couldn't paint in
    an afternoon, but keep the character of each texture in simple form (scattered dabs stay
    scattered dabs, splattered stars stay many small dots, swirls stay swirls). Don't add objects
    or turn anything into something else. It must still be clearly the same scene. Flat image, full frame, no border, no text.

finish:
  prompt: >-
    Paint this reference as a finished acrylic painting by a careful beginner on stretched canvas.
    Simple shapes, slightly soft edges, visible brushstrokes, matte acrylic finish, canvas weave
    faintly visible in thin areas. Limited palette of white, yellow, red, ultramarine blue, and
    burnt sienna. Charming and achievable, not photorealistic. Keep the composition exactly as in
    the reference, and keep every area's colors and textures as in the reference.
