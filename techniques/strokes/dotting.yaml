id: dotting
stroke_result: Dotting (brush handle end or a dotting tool, fresh paint for each dot)
name: Dotting
tools:
- the handle end of a brush
- a dotting tool
load:
  thickness: thick
  note: Dip in fresh paint for each dot or small group.
result: Round, slightly raised dots.
then: Wipe a bad dot off while it's wet, or cover it with the background color once dry.
mistakes:
- mistake: Uneven dots.
  why: Dipping into paint that has skinned over.
  fix: Keep a fresh puddle.
note: The research found few written acrylic sources for how thick the paint should be. Lower confidence on the
  load.
