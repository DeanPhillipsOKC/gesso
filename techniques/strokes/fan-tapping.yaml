id: fan-tapping
stroke_result: Fan brush tapping (thin paint, spread bristles, middle tips)
name: Fan brush tapping
brushes:
- fan
load:
  thickness: thin
  note: Stroke the brush on the palette until the bristles fan out.
motion: Stamp only the tips, using the middle of the fan, not the side bristles. For a shape that widens, work from
  the top down in a zigzag and press harder as you go down. Short strokes in different directions make a rough texture.
result: Clusters of fine, needle-like marks, light at the top and heavier where pressed.
then: If the top is too heavy, add a few fine lines with a small round instead of more fan marks.
practice: Try it on scrap paper first.
uses:
- a pine, from the top down in a zigzag
- grass, with short strokes in different directions
mistakes:
- mistake: Heavy, clumpy marks.
  why: The paint is too thick, the bristles are clumped, or you stamped with the side.
  fix: Thin the paint a little, spread the fan, and stamp with the middle tips.
diagram:
  title: Tap, then zigzag down
  stages:
  - caption: Light taps at the top
    add:
    - line: M 44 22 L 56 22
      paint: '#33393f'
      width: 2.5
    - line: M 41 30 L 59 30
      paint: '#33393f'
      width: 3
  - caption: Zigzag down, pressing harder
    add:
    - line: M 36 40 L 64 40
      paint: '#33393f'
      width: 4
    - line: M 31 52 L 69 52
      paint: '#33393f'
      width: 5
    - line: M 26 64 L 74 64
      paint: '#33393f'
      width: 6
    - line: M 22 76 L 78 76
      paint: '#33393f'
      width: 7
    arrows:
    - M 82 24 L 86 74
