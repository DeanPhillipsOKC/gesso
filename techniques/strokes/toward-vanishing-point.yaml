id: toward-vanishing-point
stroke_result: Strokes toward a vanishing point (rows, paths, fences, furrows)
name: Strokes toward one point
motion: Mark one dot on the horizon. Draw three to five faint chalk or pencil lines fanning out from it. Pull each
  row's strokes along its line, wide in front and thin near the dot.
result: Bands that narrow and bunch together toward one point, which is what makes the ground lie down and recede.
then: Check a few rows with the brush handle held from the dot.
mistakes:
- mistake: Rows run parallel or cross each other.
  fix: Mark the dot and the fan of lines first. It takes a minute.
