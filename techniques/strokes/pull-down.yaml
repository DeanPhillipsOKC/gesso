id: pull-down
stroke_result: Vertical pull-down (bright or flat, wiped nearly dry, straight down from the waterline)
name: Pull-down
brushes:
- '#12 bright'
- flat
load:
  amount: dry
motion: Stroke straight down, starting just below the thing being reflected.
result: A soft, streaky, see-through reflection of a tree, boat, or shore.
then: Once dry, cross it with thin horizontal dashes of the water color.
note: Don't be too exact. The water is moving, so a loose reflection looks right.
