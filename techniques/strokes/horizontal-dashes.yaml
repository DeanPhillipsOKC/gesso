id: horizontal-dashes
stroke_result: Horizontal dashes on water (ripples, a sun or moon path, reflections)
name: Horizontal dashes
brushes:
- flat (on its edge)
- small round
load:
  thickness: creamy
  amount: light
motion: Short, level dashes. Small and close together near the horizon, longer and wider apart lower down.
result: Short, flat, level marks with gaps of the water color between them.
then: Keep every dash level.
mistakes:
- mistake: The dashes smear into the water.
  why: The water underneath is still wet.
  fix: Paint them over dry water only.
diagram:
  title: Dashes that grow toward you
  stages:
