id: horizontal-strokes
stroke_result: Horizontal strokes for flat ground (fields, water, distant land)
name: Horizontal strokes
brushes:
- 3/4 inch flat
motion: Keep the brush level and the strokes long, left and right.
result: Flat, level bands that read as ground or water stretching away, with slight streaks that follow the stroke.
then: Lighter and smoother toward the back, darker and more textured in front.
