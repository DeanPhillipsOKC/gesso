id: petal-clusters
stroke_result: Small petal clusters (round, angle changed each mark, some past the outline)
name: Petal clusters
brushes:
- '#4 round'
motion: Small four-petal marks. Change the angle often, put some in clusters of two or three, and let some go past
  the outline for a ruffled edge.
result: A ruffled, textured flower head (hydrangea, lilac).
then: Lighter marks dense at the top and sparse at the bottom, only on a dry base.
mistakes:
- mistake: The light marks look dull once dry.
  why: Paint darkens as it dries.
  fix: Add another light layer.
