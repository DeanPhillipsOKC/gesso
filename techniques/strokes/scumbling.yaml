id: scumbling
stroke_result: Scumbling (loose, scrubby dry-brush strokes, light over dark)
name: Scumbling
brushes:
- old stiff flat
load: A small amount of paint straight from the tube, on a dry brush. No water or medium.
motion: Dry brush, but in loose, scrubby strokes in different directions that follow the shape.
result: A hazy, broken layer with the dark showing through.
then: If it covers too much, let it dry and scumble the dark back in.
mistakes:
- mistake: It covered the dark underneath.
  why: Too much paint.
  fix: Wait until it's dry and scumble the darker color back in.
note: Teachers use this word for different things. Here it means dry brush in loose scrubby strokes.
