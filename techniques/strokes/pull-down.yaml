id: pull-down
stroke_result: Vertical pull-down (bright or flat, wiped nearly dry, straight down from the waterline)
name: Pull-down
brushes:
- '#12 bright'
- flat
load:
  amount: dry
motion: Stroke straight down, starting just below the shape above.
result: Soft, streaky, see-through marks straight down.
then: Once dry, cross it with thin level dashes of the base color.
note: Don't be too exact. A loose one looks right.
uses:
- the reflection of a tree, a boat, or a shore in moving water
