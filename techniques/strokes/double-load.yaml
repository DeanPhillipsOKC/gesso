id: double-load
stroke_result: Double load (flat or angle brush, two colors on two corners)
name: Double load
brushes:
- flat
- angle
load:
  thickness: creamy
  note: One corner of the brush in one color, the other corner in the second. Reload both for each stroke.
result: A two-tone stroke that blends partway between the colors.
then: Reload both colors for each stroke. Don't try to make it fully smooth.
mistakes:
- mistake: You wanted a smooth gradient and got two tones.
  fix: That's what this stroke does. For a smooth gradient use the side-to-side blend.
