id: stamp
stroke_result: Stamp with the brush end (bright or flat, creamy load, straight down)
name: Stamp
brushes:
- '#12 bright'
load: Wet and creamy.
motion: Stamp straight down with the end of the brush. A strip of stamps makes a lavender or crop row.
result: A short, blunt block of color.
then: Stamp a lighter mix over the same row without covering all of it. Wipe the brush, don't rinse it, between
  the dark and light passes.
mistakes:
- mistake: The light pass covered the dark.
  fix: Leave dark showing. Light over dark is what gives the row depth.
