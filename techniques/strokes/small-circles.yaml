id: small-circles
stroke_result: Small circles with the brush tip (clouds)
name: Small circles
motion: Small circles with the tip of the brush make a bumpy edge. Around a bright spot, circular strokes move outward
  from it.
result: A bumpy, soft edge.
then: Smooth with the same circular motion, and put the lighter color only on the edges facing the light.
uses:
- cloud tops
- the glow around a sun or moon
mistakes:
- mistake: The edge is too hard.
  fix: Soften it with lighter passes. Smudging with a finger works too.
