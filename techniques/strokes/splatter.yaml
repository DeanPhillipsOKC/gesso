id: splatter
stroke_result: Splatter (thinned paint, toothbrush or a flicked brush)
name: Splatter
brushes:
- flat
tools:
- an old toothbrush
load:
  thickness: thin
  note: Too much water gives big drips.
motion: Flick the bristles with a finger, or tap the brush on another handle.
result: Random speckles, for stars or snow.
then: Let it dry before the next step.
mistakes:
- mistake: Speckles where you don't want them.
  fix: Wipe them right away with a damp cloth or cotton swab.
