id: liner
stroke_result: Liner work (paint thinned to ink, brush upright, light steady pressure)
name: Liner work
brushes:
- liner
- small round (the tip)
load: 'Thin the paint with water until it flows like ink: swirl the brush in water, then in the paint. Reload often.'
motion: Hold the brush upright, with light, steady pressure. For branches, start thick at the trunk and taper. Let
  branches fork in different directions and overlap, and wobble the edges a little.
result: Thin, flowing lines.
then: Reload often.
mistakes:
- mistake: Skippy, broken lines.
  why: The paint is too thick.
  fix: Add water.
- mistake: Lines spread or feather.
  why: The paint underneath is still wet.
  fix: Only paint lines over dry paint.
practice: Try a few lines on scrap paper first.
