id: dry-brush
stroke_result: Dry brush (no water, tip loaded and wiped nearly clean, light pressure)
name: Dry brush
brushes:
- flat
- old stiff flat (catches the canvas weave best)
load:
  thickness: thick
  amount: dry
  note: Only the tip goes in the paint, and no water on the brush. It should feel dry and hard to apply.
motion: Light pressure, skimming the surface.
result: Feathery, broken, see-through marks that catch the canvas texture. Never a solid area.
then: Build up in several light passes.
uses:
- cloud highlights
- grass
- wood and fences
- highlights on round things
mistakes:
- mistake: It went on solid.
  why: The brush was too loaded.
  fix: Let it dry, then dry-brush the base color back over part of it.
practice: 'Try it on scrap paper first: wipe the brush until it leaves broken marks.'
