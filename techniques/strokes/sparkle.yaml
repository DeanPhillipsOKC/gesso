name: Sparkle
brushes:
- 10/0 liner
result: A tiny asterisk of light on the water.
then: Use only a few, beside the brightest part of the sun or moon path.
mistakes:
- mistake: The sparkle spreads into a smudge.
  why: The paint underneath is still wet.
  fix: Wait until everything is dry.
