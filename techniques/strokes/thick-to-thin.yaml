id: thick-to-thin
stroke_result: Thick-to-thin (flat or angle brush, press, then turn to the edge)
name: Thick to thin
brushes:
- flat
- angle
motion: Press the full width of the brush for the thick part, then turn onto its edge or tip and lighten the pressure.
  With an angle brush, the lighter you press, the thinner the line.
result: A line that starts wide and tapers to a point, for branches and grass.
then: Add a few thinner offshoots with a liner.
