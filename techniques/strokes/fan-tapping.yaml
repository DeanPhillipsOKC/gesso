id: fan-tapping
stroke_result: Fan brush tapping (thin paint, spread bristles, middle tips)
name: Fan brush tapping
brushes:
- fan
load: 'Thin paint: thin it with a little water. Stroke the brush on the palette until the bristles fan out.'
motion: Stamp only the tips, using the middle of the fan, not the side bristles. For a pine, work from the top down
  in a zigzag and press harder as you go down. Short strokes in different directions make grass.
result: Needle or branch clusters, light at the top and heavier where pressed.
then: If the top is too heavy, add fine branches with a small round instead of more fan marks.
practice: Try it on scrap paper first.
mistakes:
- mistake: Heavy, clumpy marks.
  why: The paint is too thick, the bristles are clumped, or you stamped with the side.
  fix: Thin the paint a little, spread the fan, and stamp with the middle tips.
