id: dabbing
stroke_result: Dabbing or stippling (round tip or stiff brush, little paint)
name: Dabbing
also_called:
- stippling
brushes:
- round (the tip, for small dots)
- old stiff brush (for foliage)
tools:
- a sponge, for soft patches
load:
  amount: light
  note: 'No water on the brush: a wet one makes blobs.'
motion: Tap with the tip of the brush. The more you tap one spot, the more solid it gets.
result: Dots or dappled patches that get more solid the more you tap.
then: Tap a lighter mix on the lit side, leaving the darker taps showing underneath.
mistakes:
- mistake: Blobs instead of dots.
  why: The brush is too wet or holds too much paint.
  fix: Wipe most of the paint off on a paper towel and tap again.
- mistake: A patch went too solid.
  fix: Tap over it with a lighter or darker mix to break it up.
